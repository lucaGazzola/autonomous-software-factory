# Software Factory configuration.
# Everything is one flat file; relative paths resolve against this file's directory.
# Copy to your factory directory and run `factory start --config factory.yaml`.

name: my-factory                # Display name used in logs and commit messages.
repo: /path/to/repository       # The git repository the factory works on.
interval_minutes: 60            # How often the factory runs.
branch: main                    # Everything is committed to this branch (no feature branches).
remote: origin                  # Git remote to push to; omit to only commit locally.
# git_timeout_seconds: 120      # Kill a stuck git command after this many seconds
                                # (default 120). Raise for slow remotes.

backlog: backlog.json           # The task backlog (created on first use). Keep it
                                # outside the repository so it is never committed.
blocker_file: BLOCKER.md        # Written with a detailed explanation when the agent
                                # needs human input. Keep it outside the repository.

# The coding agent: any shell command. Read $FACTORY_TASK for the task, work in the
# repo directory, and exit with:
#   0 = success             (work is committed and pushed)
#   2 = needs human input   (BLOCKER.md is written; factory pauses)
#   other = error           (work is discarded, task marked FAILED)
agent_command: "aider --message \"$FACTORY_TASK\""
# agent_timeout_seconds: 3600   # Optional escape hatch: kill a stuck agent after
                                # this many seconds. Omitted = never kill; an
                                # overlong run just skips the next iteration.
agent_env: {}                 # Extra environment variables for the agent process.
blocked_exit_code: 2

# Instruction used when the backlog has no runnable task: the factory refactors.
refactor_prompt: |
  Review the codebase for improvement opportunities that do not change
  behavior: dead code, duplication, overly complex functions, missing
  tests, outdated comments. Apply the safe improvements you find and run
  the test suite to verify nothing broke. If nothing needs refactoring,
  make no changes.

log_file: factory.log
# web_port: 8787                # Local read-only HTTP API on 127.0.0.1 (0 = off).

# Optional Telegram notifications when a task (or refactoring pass) turns
# BLOCKED. Set both keys to enable; omit to disable. The message includes the
# factory name, the task id and title, and the first lines of the blocker
# reason. Uses the stdlib only; a failed notification never affects the run.
# telegram_bot_token: "123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11"
# telegram_chat_id: "-1001234567890"
