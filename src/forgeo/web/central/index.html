<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgeo &middot; Instances</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/central/central.css">
</head>
<body data-page="home">
<div class="shell">

  <header class="topbar">
    <div class="brand">
      <span class="brand-dot" aria-hidden="true"></span>
      <span class="brand-name">Forgeo &middot; Instances</span>
    </div>
    <dl class="meta">
      <div class="meta-item">
        <dt>instances</dt>
        <dd id="meta-count">&mdash;</dd>
      </div>
    </dl>
  </header>

  <main class="instance-list" id="instance-list" aria-live="polite">
    <div class="empty-state" id="empty-state" hidden>
      <p class="empty-title">No registered instances</p>
      <p class="empty-sub">Register one with <code>forgeo instance add NAME --config PATH</code>.</p>
    </div>
  </main>

  <footer class="footerbar">
    <span class="notice" id="daemon-notice" hidden>central dashboard unreachable &mdash; retrying every 30s</span>
    <span class="fetch-time">fetch <time id="fetch-time">never</time></span>
  </footer>

</div>
<script src="/central/central.js"></script>
</body>
</html>
